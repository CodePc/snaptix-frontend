server:
  # 8080 is often taken by other IntelliJ Tomcat runs; use 8081 for SnapTix locally
  port: 8081
  servlet:
    context-path: /api/v1

spring:
  application:
    name: snaptix-backend
  datasource:
    # Dedicated Hibernate DB (do not reuse design-schema `snaptix` — UUID column types clash)
    # Docker: snaptix-mysql on 127.0.0.1:3310 (eventpulse/docker-compose.yml)
    url: jdbc:mysql://127.0.0.1:3310/snaptix_app?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: snaptix
    password: snaptix
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC

snaptix:
  jwt:
    secret: 9a2f8c3d1e4b7a6c5d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c
    expiration-ms: 86400000 # 24 Hours
  pass:
    hmac-time-step-seconds: 15

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    env:
      show-values: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs
